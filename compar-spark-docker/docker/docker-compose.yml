services:

  spark-master:
    image: spark:python3
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ..:/opt/project

  spark-worker:
    image: spark:python3
    user: root
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 2
      --memory 2G
    depends_on:
      - spark-master
    volumes:
      - ..:/opt/project

  spark-history:
    image: spark:python3
    container_name: spark-history
    user: root
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.history.HistoryServer
    environment:
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=/opt/project/spark-events"
    ports:
      - "18080:18080"
    volumes:
      - ..:/opt/project

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jupyter
    user: root
    environment:
      HOME: /tmp
      JUPYTER_CONFIG_DIR: /tmp/jupyter
      JUPYTER_RUNTIME_DIR: /tmp/jupyter/runtime
      JUPYTER_DATA_DIR: /tmp/jupyter/data
      JUPYTER_TOKEN: shared_spark_token
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ..:/opt/project
    working_dir: /opt/project
    depends_on:
      - spark-master
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root